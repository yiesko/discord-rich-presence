[package]
name = "rsrpc-cli"
version = "0.37.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Alternative Discord RPC server CLI: game detection with bundled database, IPC/WebSocket transports and bridge"
license.workspace = true
readme = "../README.md"
repository.workspace = true
keywords = ["discord", "rich-presence", "rpc", "bridge", "cli"]
categories = ["command-line-utilities"]

[lints]
workspace = true

[dependencies]
rsrpc-core = { path = "../crates/rsrpc-core" }
rsrpc-detect = { path = "../crates/rsrpc-detect" }
clap = { version = "4.6.6", features = ["derive", "std", "env", "help", "usage", "error-context"], default-features = false }
ureq.workspace = true
serde.workspace = true
serde_json.workspace = true
semver = "1.0"
sha2 = "0.10"
minisign-verify = "0.2"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "std"] }
