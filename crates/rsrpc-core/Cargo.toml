[package]
name = "rsrpc-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "rsRPC daemon wiring: config, database loading, one-shot diagnostics, async run"
license.workspace = true
repository.workspace = true
keywords = ["discord", "rich-presence", "rpc", "daemon"]
categories = ["network-programming", "asynchronous"]

[lints]
workspace = true

[dependencies]
rsrpc-types = { path = "../rsrpc-types" }
rsrpc-protocol = { path = "../rsrpc-protocol" }
rsrpc-detect = { path = "../rsrpc-detect" }
rsrpc-telemetry = { path = "../rsrpc-telemetry" }
rsrpc-transport-ipc = { path = "../rsrpc-transport-ipc" }
rsrpc-transport-ws = { path = "../rsrpc-transport-ws" }
rsrpc-bridge = { path = "../rsrpc-bridge" }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "time", "macros", "sync"] }
serde_json.workspace = true
ureq.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["net", "rt-multi-thread", "time", "macros", "sync"] }
serde_json.workspace = true
