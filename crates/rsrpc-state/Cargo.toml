[package]
name = "rsrpc-state"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["spikehd"]
description = "rsRPC presence snapshot slots for external tooling"
license = "MIT"
repository = "https://github.com/yiesko/rsRPC"
keywords = ["discord", "rich-presence", "rpc"]
categories = ["network-programming"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"

[dev-dependencies]
serde_json = "1.0"
