[package]
name = "rsrpc-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["spikehd"]
description = "arRPC-compatible activity bridge: fan-out, replay cache, handoff, debounced snapshots"
license = "MIT"
repository = "https://github.com/yiesko/discord-rich-presence"
keywords = ["discord", "rich-presence", "rpc"]
categories = ["network-programming", "asynchronous"]

[lints]
workspace = true

[dependencies]
rsrpc-types = { path = "../rsrpc-types" }
rsrpc-protocol = { path = "../rsrpc-protocol" }
rsrpc-state = { path = "../rsrpc-state" }
rsrpc-telemetry = { path = "../rsrpc-telemetry" }
rsrpc-ws = { path = "../rsrpc-ws" }
tokio = { version = "1.53", features = ["net", "rt-multi-thread", "time", "macros", "sync"] }
tokio-util = { version = "0.7", default-features = false }
bytes = "1.12"
tungstenite = "0.30"
serde_json = "1.0"
rmp-serde = "1.3"
tracing = "0.1"
rustc-hash = "2.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["net", "rt-multi-thread", "time", "macros", "sync"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
serde_json = "1.0"
rmp-serde = "1.3"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
