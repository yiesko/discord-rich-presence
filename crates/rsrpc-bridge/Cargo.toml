[package]
name = "rsrpc-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["spikehd"]
description = "arRPC-compatible activity bridge: fan-out, replay cache, handoff, debounced snapshots"
license = "MIT"
repository = "https://github.com/yiesko/rsRPC"
keywords = ["discord", "rich-presence", "rpc"]
categories = ["network-programming", "asynchronous"]

[lints]
workspace = true

[dependencies]
rsrpc-types = { path = "../rsrpc-types" }
rsrpc-protocol = { path = "../rsrpc-protocol" }
rsrpc-state = { path = "../rsrpc-state" }
rsrpc-ws = { path = "../rsrpc-ws" }
tokio = { version = "1.53", features = ["net", "rt-multi-thread", "time", "macros", "sync"] }
tokio-util = { version = "0.7", features = ["full"] }
bytes = "1.12"
serde_json = "1.0"
rmp-serde = "1.3"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.53", features = ["net", "rt-multi-thread", "time", "macros", "sync"] }
tokio-tungstenite = "0.30"
tungstenite = "0.30"
futures-util = "0.3"
serde_json = "1.0"
rmp-serde = "1.3"
