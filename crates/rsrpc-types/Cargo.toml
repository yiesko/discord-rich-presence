[package]
name = "rsrpc-types"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["spikehd"]
description = "Core wire types for rsRPC: ids, activity commands, bridge identity"
license = "MIT"
repository = "https://github.com/yiesko/rsRPC"
keywords = ["discord", "rich-presence", "rpc"]
categories = ["network-programming"]

[lints]
workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_with = "3.21"
chrono = "0.4"

[dev-dependencies]
serde_json = "1.0"
