[package]
name = "rsrpc-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["spikehd"]
description = "rsRPC wire protocol: errors, bridge payloads, reply builders, flood guard"
license = "MIT"
repository = "https://github.com/yiesko/rsRPC"
keywords = ["discord", "rich-presence", "rpc"]
categories = ["network-programming"]

[dependencies]
rsrpc-types = { path = "../rsrpc-types" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_with = "3.21"
rmp-serde = "1.3"
thiserror = "2.0"
ureq = { version = "3", default-features = false, features = ["rustls", "charset"] }

[dev-dependencies]
serde_json = "1.0"
rsrpc-types = { path = "../rsrpc-types" }
