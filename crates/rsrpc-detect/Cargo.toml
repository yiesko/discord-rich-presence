[package]
name = "rsrpc-detect"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["spikehd"]
description = "Game detection: database, Aho-Corasick bundle, process scanner, hourly refresh"
license = "MIT"
repository = "https://github.com/yiesko/rsRPC"
keywords = ["discord", "games", "detection"]
categories = ["parser-implementations"]

[lints]
workspace = true

[dependencies]
rsrpc-types = { path = "../rsrpc-types" }
rsrpc-protocol = { path = "../rsrpc-protocol" }
rsrpc-telemetry = { path = "../rsrpc-telemetry" }
rsrpc-steam = { path = "../rsrpc-steam" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.21"
regex = "1.11"
aho-corasick = "1.1"
ureq = { version = "3", default-features = false, features = ["rustls", "charset"] }
tracing = "0.1"
arc-swap = "1"
rustc-hash = "2.1"
# Profiling only: inert unless a `hotpath-*` feature is enabled.
hotpath = "0.25"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
rsrpc-proc-events = { path = "../rsrpc-proc-events" }

[target.'cfg(not(target_os = "linux"))'.dependencies]
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "multithread"] }

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["namedpipeapi", "winbase", "heapapi"] }

[dev-dependencies]
serde_json = "1.0"
criterion = "0.8.2"
rustc-hash = "2.1"
rsrpc-telemetry = { path = "../rsrpc-telemetry" }

[[bench]]
name = "maps"
harness = false
