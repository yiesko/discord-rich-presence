[package]
name = "rsrpc-steam"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["spikehd"]
description = "Steam library provider: VDF parsing, install-dir index, refresh with mtime fingerprints"
license = "MIT"
repository = "https://github.com/yiesko/discord-rich-presence"
keywords = ["steam", "games", "vdf"]
categories = ["parser-implementations"]

[lints]
workspace = true

[dependencies]
serde_json = "1.0"
tracing = "0.1"
# Profiling only: inert unless a `hotpath-*` feature is enabled.
hotpath = "0.25"
