[package]
name = "rsrpc-db-updater"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Fetches Discord's detectable games database and writes a trimmed offline snapshot for rsrpc"
license = "MIT"

[workspace]

[dependencies]
ureq = { version = "3.3", default-features = false, features = ["rustls", "charset"] }
serde_json = "1"
rsrpc-detect = { path = "../../crates/rsrpc-detect" }