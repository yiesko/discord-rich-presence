name: Build

on:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'crates/**/*'
      - 'cli/**/*'
      - 'tools/**/*'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'crates/**/*'
      - 'cli/**/*'
      - 'tools/**/*'
      - 'Cargo.toml'
      - 'Cargo.lock'

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.config.platform }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - platform: ubuntu-22.04
            target: 'x86_64-unknown-linux-gnu'
          - platform: ubuntu-22.04
            target: 'aarch64-unknown-linux-gnu'
          - platform: ubuntu-22.04
            target: 'armv7-unknown-linux-gnueabihf'

          - platform: macos-latest
            target: 'x86_64-apple-darwin'
          - platform: macos-latest
            target: 'aarch64-apple-darwin'

          - platform: windows-latest
            target: 'x86_64-pc-windows-msvc'
          - platform: windows-latest
            target: 'aarch64-pc-windows-msvc'

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Generate detectable snapshot
        run: cargo run --manifest-path tools/updater/Cargo.toml

      - name: (Linux) ARM sources.list
        if: matrix.config.target == 'aarch64-unknown-linux-gnu' || matrix.config.target == 'armv7-unknown-linux-gnueabihf'
        run: |
          # Add [arch=amd64] to the initial entries of the sources.list
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
  
          echo "deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports/ $(lsb_release -cs) main restricted" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports/ $(lsb_release -cs)-updates main restricted" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports/ $(lsb_release -cs) universe" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports/ $(lsb_release -cs)-updates universe" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports/ $(lsb_release -cs) multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports/ $(lsb_release -cs)-updates multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports/ $(lsb_release -cs)-backports main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports/ $(lsb_release -cs)-security main restricted" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports/ $(lsb_release -cs)-security universe" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports/ $(lsb_release -cs)-security multiverse" | sudo tee -a /etc/apt/sources.list
  
      # ARM-linux related sources and dpkg config and such
      - name: (Linux) ARM setup
        if: matrix.config.target == 'aarch64-unknown-linux-gnu' || matrix.config.target == 'armv7-unknown-linux-gnueabihf'
        run: |
          sudo dpkg --add-architecture arm64
          sudo dpkg --add-architecture armhf
          sudo apt-get update

      - name: (Linux) (ARMv7) Install dependencies
        if: matrix.config.target == 'armv7-unknown-linux-gnueabihf'
        run: |
          sudo apt-get install -y \
            libssl-dev:armhf \
            gcc-arm-linux-gnueabihf
    
      - name: (Linux) (ARM64) Install dependencies
        if: matrix.config.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y \
            libssl-dev:arm64 \
            gcc-aarch64-linux-gnu

      - name: Install target
        run: rustup target add ${{ matrix.config.target }}

      - name: Build
        if: matrix.config.target != 'armv7-unknown-linux-gnueabihf' && matrix.config.target != 'aarch64-unknown-linux-gnu'
        run: cargo build -p rsrpc-cli --release --locked --target ${{ matrix.config.target }}
        env:
          RUSTFLAGS: -Awarnings

      - name: (Linux) (ARMv7) Build
        if: matrix.config.target == 'armv7-unknown-linux-gnueabihf'
        run: cargo build -p rsrpc-cli --release --locked --target ${{ matrix.config.target }} --config target.armv7-unknown-linux-gnueabihf.linker=\'arm-linux-gnueabihf-gcc\'
        env:
          RUSTFLAGS: -Awarnings -L/usr/lib/arm-linux-gnueabihf
          CC: arm-linux-gnueabihf-gcc
          PKG_CONFIG_SYSROOT_DIR: /usr/
          PKG_CONFIG_PATH: /usr/lib/arm-linux-gnueabihf/pkgconfig

      - name: (Linux) (ARM64) Build
        if: matrix.config.target == 'aarch64-unknown-linux-gnu'
        run: cargo build -p rsrpc-cli --release --locked --target ${{ matrix.config.target }} --config target.aarch64-unknown-linux-gnu.linker=\'aarch64-linux-gnu-gcc\'
        env:
          RUSTFLAGS: -Awarnings -L/usr/lib/aarch64-linux-gnu
          CC: aarch64-linux-gnu-gcc
          PKG_CONFIG_SYSROOT_DIR: /usr/
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig

      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: rsrpc-${{ matrix.config.target }}
          # Find exec based on platform
          path: target/${{ matrix.config.target }}/release/rsrpc-cli${{ matrix.config.platform == 'windows-latest' && '.exe' || '' }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Download all artifacts from the build job
      - name: Download artifacts
        # NOTE: no node24 release yet (v6 still targets node20); bump when upstream ships it.
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Zip each artifact and cleanup
        run: |
          set -e
          BASE_DIR="artifacts"
          for dir in "$BASE_DIR"/*; do
            FOLDER_NAME=$(basename "$dir")
            ZIP_FILE="${FOLDER_NAME}.zip"
            echo "Zipping $dir into $ZIP_FILE..."
            zip -j -r "$ZIP_FILE" "$dir"
            echo "Deleting $dir..."
            rm -rf "$dir"
          done

      - name: Stage OTA binaries and checksums
        run: |
          set -e
          # Raw (unarchived) binaries for the self-update client, plus a
          # sha256sum-compatible manifest covering everything uploaded.
          # MVP targets only: Linux x86_64 + ARM64. NOTE: this runs after
          # the zip step above already removed the artifact dirs, so the
          # binaries are pulled back out of their zips.
          unzip -p rsrpc-x86_64-unknown-linux-gnu.zip rsrpc-cli > ./rsrpc-cli-x86_64-unknown-linux-gnu
          unzip -p rsrpc-aarch64-unknown-linux-gnu.zip rsrpc-cli > ./rsrpc-cli-aarch64-unknown-linux-gnu
          chmod +x rsrpc-cli-x86_64-unknown-linux-gnu rsrpc-cli-aarch64-unknown-linux-gnu
          sha256sum rsrpc-cli-x86_64-unknown-linux-gnu rsrpc-cli-aarch64-unknown-linux-gnu rsrpc*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Sign OTA manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -e
          # The OTA client verifies this signature against the pubkey
          # embedded in cli/src/update.rs before trusting any hash: without
          # it, staged binaries never execute. Missing secret fails the
          # release loudly instead of shipping unsigned.
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::MINISIGN_SECRET_KEY is not set; refusing to ship an unsigned release"
            exit 1
          fi
          curl -sL -o /tmp/minisign.tgz https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          mkdir -p /tmp/minisign && tar -xzf /tmp/minisign.tgz -C /tmp/minisign
          MS=/tmp/minisign/minisign-linux/x86_64/minisign
          printf '%s' "$MINISIGN_SECRET_KEY" > /tmp/ota.sec
          chmod 600 /tmp/ota.sec
          "$MS" -S -s /tmp/ota.sec -m SHA256SUMS.txt -t "rsrpc release ${{ github.ref_name }}"
          shred -u /tmp/ota.sec || rm -f /tmp/ota.sec
          # Self-check with the embedded pubkey before publishing.
          "$MS" -V -P RWT97nYjybg6X/Q35LBD/thrjkAmYmEHbRm8TQjvpJeLO2kNONgb4ibw -m SHA256SUMS.txt

      - name: Changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="$PREV_TAG..HEAD"
          fi
          {
            echo "## Commits in ${{ github.ref_name }} ($RANGE)"
            echo ""
            git log "$RANGE" --pretty=format:'- %s (%h)' --reverse
            echo ""
          } > RELEASE_NOTES.md

      - name: Create release using all artifacts
        uses: softprops/action-gh-release@v3
        if: github.event_name != 'schedule'
        with:
          files: |
            rsrpc*.zip
            rsrpc-cli-x86_64-unknown-linux-gnu
            rsrpc-cli-aarch64-unknown-linux-gnu
            SHA256SUMS.txt
            SHA256SUMS.txt.minisig
          token: ${{ secrets.GITHUB_TOKEN }}
          # Release name is the tag name
          name: ${{ github.ref_name }} - ${{ github.sha }}
          draft: false
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          prerelease: false
