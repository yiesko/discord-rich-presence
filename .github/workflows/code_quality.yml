name: Code quality and formatting

on:
  push:
    paths:
      - '.github/workflows/code_quality.yml'
      - 'crates/**'
      - 'cli/**'
      - 'tools/**'
      - 'plugin/**'
      - 'scripts/**'
      - 'systemd/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
  pull_request:
    paths:
      - '.github/workflows/code_quality.yml'
      - 'crates/**'
      - 'cli/**'
      - 'tools/**'
      - 'plugin/**'
      - 'scripts/**'
      - 'systemd/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  shell:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Shell syntax check
        run: bash -n scripts/install.sh && bash -n scripts/uninstall.sh

  rustfmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Rustfmt check
        run: cargo fmt --manifest-path ./Cargo.toml --all -- --check

  clippy:
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Generate detectable snapshot
        run: cargo run --manifest-path tools/updater/Cargo.toml

      - name: Clippy check
        run: cargo clippy --manifest-path ./Cargo.toml --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Generate detectable snapshot
        run: cargo run --manifest-path tools/updater/Cargo.toml

      - name: Test
        run: cargo test --manifest-path ./Cargo.toml --workspace --locked

  doc:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Generate detectable snapshot
        run: cargo run --manifest-path tools/updater/Cargo.toml

      - name: Doc
        run: cargo doc --manifest-path ./Cargo.toml --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Security audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  msrv:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95
        with:
          toolchain: 1.95

      - name: Generate detectable snapshot
        run: cargo run --manifest-path tools/updater/Cargo.toml

      - name: MSRV check
        run: cargo check --manifest-path ./Cargo.toml --workspace --all-targets --locked
