[workspace]
members = ["lib", "cli", "crates/rsrpc-ws", "crates/rsrpc-types", "crates/rsrpc-protocol", "crates/rsrpc-transport-ws", "crates/rsrpc-transport-ipc", "crates/rsrpc-state", "crates/rsrpc-bridge", "crates/rsrpc-telemetry"]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Profiling builds: release-like but with symbols and no LTO/inlining
# surprises, so hotpath attribution stays readable. Never shipped.
[profile.profiling]
inherits = "release"
debug = true
strip = false
lto = false
panic = "unwind"
